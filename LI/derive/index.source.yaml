version: 0.1
scope: LI.derive
description: >
  Canonical language-infrastructure sources defining append-only functional
  derivation from captured LUIs (iam.db) to derived artifacts (chunks,
  semantic coordinates, continuity nodes) suitable for storage in SubDB.
sources:
  - path: LI/derive/README.md
    role: scope
    authority: canonical
    notes: Defines append-only functional derivation invariants and engine boundary.

  - path: LI/derive/ContinuityNodeContract.md
    role: contract
    authority: canonical
    notes: Minimal required schema for continuity nodes and provenance.

  - path: LI/derive/ChunkingContract.md
    role: contract
    authority: canonical
    notes: Continuity-preserving chunking contract for bounded-context inference.

  - path: LI/derive/invariants.md
    role: invariants
    authority: canonical
    notes: Derivation invariants that must hold across chunking and continuity-node construction.

  - path: LI/derive/mapping.md
    role: mapping
    authority: canonical
    notes: Mapping from captured language-use inputs to derived continuity artifacts.
