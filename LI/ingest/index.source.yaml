version: 0.1
scope: LI.ingest
description: >
  Authoritative language-infrastructure sources defining the ingest boundary
  (REST -> append-only capture -> iam.db) and its executable conformance surface.
sources:
  - path: architecture/ingestion-server/IngestServerContract.md
    role: contract
    authority: canonical
    notes: REST ingest boundary; LUI admissibility; idempotency; ordering; non-goals.

  - path: Migrations/0001_capture_contract.sql
    role: schema
    authority: canonical
    notes: >
      Capture authority schema for iam.db; append-only substrate for ingestion.
      This scope is block-canonical: schema must support canonical block capture.

  - path: services/ingest_server_v0/app.py
    role: implementation
    authority: supporting
    notes: >
      Minimal ingest logger implementing POST /v1/luis for spooler drain testing (dev sink).
      Must conform to LI/ingest/invariants.md and the canonical migration schema.

  - path: code/ingest/ingest_chatgpt_export.py
    role: adapter
    authority: supporting
    notes: >
      Offline adapter example. For this scope, adaptors should prefer block-canonical
      envelopes when the source supports maximal blocks. Turn-level emission may exist
      as a derived/supporting mode.

  - path: code/provDB/build_provdb_core.py
    role: downstream_builder
    authority: supporting
    notes: Downstream consumer of capture authority; establishes dependency direction.

  - path: code/subDB/build_subdb_core.py
    role: downstream_builder
    authority: supporting
    notes: Downstream consumer; numeric substrate build from derived structures.

  - path: LI/ingest/invariants.md
    role: invariants
    authority: canonical
    notes: Executable invariants for ingest boundary; block-canonical capture; replay/versioning rules.