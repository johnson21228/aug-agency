        title: Continuity, Privacy, and the Conditions of Thought
      - path: writing/essays/judgment-preserved.md
        title: Judgment, Preserved
      - path: writing/essays/agency-in-an-age-of-agents.md
        title: Agency in an Age of Agents
      - path: writing/essays/claude-chatgpt-limits-for-thinking.md
        title: Limits of “Thinking Support” Without Continuity
      - path: writing/essays/AfterWorkAfterJudgement.md
        title: After Work, After Judgment
      - path: writing/essays/making-cognition-legible.md
        title: Making Cognition Legible

  start_here_builders:
