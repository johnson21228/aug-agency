site:
  title: IAM — Writings
  h1: IAM — Writings
  lede: >
    Essays examining the structural conditions under which human judgment,
    continuity, and responsibility remain possible in environments increasingly
    shaped by automated and agentic systems.

  audiences:
    general: Readers seeking orientation to continuity, judgment, and responsibility.
    builders: System builders, researchers, and educators concerned with legibility and invariants.

reading_paths:
