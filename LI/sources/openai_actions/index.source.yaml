version: 0.1
scope: LI.sources.openai_actions
description: >
  OpenAI Actions protocol source defining REST ingress, schema validation,
  and LUI emission semantics.
sources:
  - path: LI/sources/openai_actions/ActionServerContract.md
    role: contract
    authority: canonical
    notes: REST contract and non-goals for Actions-based LUI ingress.

  - path: LI/sources/openai_actions/openapi.yaml
    role: protocol
    authority: canonical
    notes: OpenAPI schema for Actions integration.

  - path: LI/sources/openai_actions/invariants.md
    role: invariants
    authority: canonical
    notes: Deterministic mapping and idempotency invariants.

  - path: services/openai_actions_adapter_v0/
    role: implementation
    authority: supporting
    notes: Reference Actions adapter service (namespace reserved).
