# IAM Writings Index (Machine-Readable)
#
# PURPOSE
# - Continuity spine for the writings corpus.
# - Stable identifiers, ordering, dependency links, authority status.
# - NOT a summary or semantic interpretation layer.
#
# EDIT / EVOLUTION RULES (append-only discipline)
# 1) Do not delete entries.
# 2) Do not reuse an id once assigned.
# 3) Do not change an entry's id.
# 4) Prefer not to change an entry's path. If a file is renamed/moved:
#    - keep the old entry
#    - add a new entry with a new id
#    - link them via relations: {type: renamed_from|supersedes|clarifies|extends}
# 5) Promotion requires:
#    - authoritative: true
#    - status: published
#    - inclusion in writing/INDEX.md (human-facing index)
#
version: 1

policies:
  append_only: true
  id_reuse: forbidden
  delete_entries: forbidden
  prefer_new_entries_over_mutation: true
  authority_order:
    - writing
    - architecture
    - patent
    - embodiments
    - code
    - data

